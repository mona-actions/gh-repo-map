# gh-repo-map configuration
# This file is OPTIONAL — you can use CLI flags instead.
# Copy to config.yml and fill in your values.

# ─── Authentication ─────────────────────────────────────────────────────────
# Auth is resolved automatically if you don't configure it here:
#   1. CLI flags (--token or --app-id + --private-key-path)
#   2. Env vars (GH_TOKEN or GH_APP_ID + GH_APP_PRIVATE_KEY)
#   3. gh auth login (automatic)
#
# GitHub App auth (recommended for scale — 5,000 req/hr per installation):
# auth:
#   type: "github-app"
#   app_id: 123456                     # or set GH_APP_ID env var
#   private_key_path: "./my-app.pem"   # or set GH_APP_PRIVATE_KEY env var (PEM content)
#
# PAT auth (not recommended in config — use --token flag or GH_TOKEN env var):
# auth:
#   type: "pat"
#   token: "ghp_xxxxxxxxxxxx"

# ─── Target ─────────────────────────────────────────────────────────────────
# GitHub hostname — leave empty or omit for github.com, set for GHES.
# Can be overridden with --github-host flag.
# github_host: "github.example.com"

# Organizations to scan. Can also use --orgs-file flag (both are combined).
orgs:
  - my-org
  - my-other-org

# ─── Container Registries ───────────────────────────────────────────────────
# Docker registries to check for internal images.
# ghcr.io is always included. Add your private registries here.
container_registries:
  - "ghcr.io"
  - "docker.pkg.github.com"
  # - "my-company.jfrog.io"
  # - "123456789.dkr.ecr.us-east-1.amazonaws.com"

# ─── Overrides ──────────────────────────────────────────────────────────────
# Path to a YAML file with manual package→repo corrections.
# See overrides.example.yml for the format.
# overrides_path: "./overrides.yml"

# ─── File Scan Targets ──────────────────────────────────────────────────────
scan:
  # Directory names treated as vendored third-party code and excluded from file scan.
  # Defaults:
  # - node_modules
  # - vendor
  # - third_party
  # - third-party
  # - bower_components
  # - jspm_packages
  # vendored_dirs:
  #   - "node_modules"
  #   - "vendor"
  #   - "third_party"
  #   - "third-party"
  #   - "bower_components"
  #   - "jspm_packages"

  # Directory names where *.sh files are considered target build scripts.
  # Defaults: scripts, build, ci, hack, tools, .
  # script_dirs:
  #   - "scripts"
  #   - "build"
  #   - "ci"
  #   - "hack"
  #   - "tools"
  #   - "."

# ─── Scan Options ───────────────────────────────────────────────────────────
options:
  # Include forked repos in the scan (default: false)
  include_forks: false

  # Continue scanning if SBOM fetch fails for a repo (default: false)
  skip_sbom_errors: true

  # Number of files per GraphQL batch request (default: 15)
  graphql_batch_size: 15

  # Use recursive tree API for file discovery (default: true)
  tree_fallback_recursive: true

  # Output splitting: "merged", "per-org", or "auto" (default: "auto")
  # auto = merged if <500 repos, per-org otherwise
  output_split: "auto"

  # How often to write checkpoint to disk, in repos processed (default: 10)
  checkpoint_flush_interval: 10

  # Max concurrent org workers, 1-10 (default: 4)
  concurrency: 4

  # Min % of repos that must be scanned before output is written (default: 80)
  min_coverage: 80

  # Log level: "quiet", "default", "verbose", "debug" (default: "default")
  log_level: "default"

  # Write logs to a file in addition to stderr
  # log_file: "./gh-repo-map.log"

# ─── Output ─────────────────────────────────────────────────────────────────
output:
  # Path for the output JSON file (default: ./output/dep-graph.json)
  path: "./output/dep-graph.json"

  # Include transitive dependencies in output (default: false)
  include_transitive: false

  # Include unresolved (external) packages in output (default: true)
  include_unresolved: true
